# POP3
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: banner-pop3
info:
  name: POP3
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - recon
  - banner
  - pop3
  - mail
  description: Read-first banner grab for POP3.
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|110}}'
socket:
  timeout: 5s
tempo:
  preflight: true
flow:
- recv:
    read: 1024
  matchers:
  - type: word
    part: data
    words:
    - +OK
  on_match:
    log: POP3 banner captured
    capture:
      to: loot/banner-pop3.txt
      part: data
