# Telnet
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: banner-telnet
info:
  name: Telnet
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - recon
  - banner
  - telnet
  description: Read-first banner grab for Telnet.
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|23}}'
socket:
  timeout: 5s
tempo:
  preflight: true
flow:
- recv:
    read: 1024
  matchers:
  - type: len
    part: data
    min: 1
  on_match:
    log: Telnet banner captured
    capture:
      to: loot/banner-telnet.txt
      part: data
