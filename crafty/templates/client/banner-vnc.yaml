# VNC (RFB)
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: banner-vnc
info:
  name: VNC (RFB)
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - recon
  - banner
  - vnc
  description: Read-first banner grab for VNC (RFB).
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|5900}}'
socket:
  timeout: 5s
tempo:
  preflight: true
flow:
- recv:
    read: 1024
  matchers:
  - type: word
    part: data
    words:
    - RFB
  on_match:
    log: VNC (RFB) banner captured
    capture:
      to: loot/banner-vnc.txt
      part: data
