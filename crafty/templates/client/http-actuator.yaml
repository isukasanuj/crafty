# Spring Boot actuator
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-actuator
info:
  name: Spring Boot actuator
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - exposure
  - spring
  description: 'HTTP probe: Spring Boot actuator (GET /actuator).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /actuator HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - _links
    - health
  on_match:
    log: 'Spring Boot actuator: {{RHOST}} matched'
    capture:
      to: loot/http-actuator.txt
      value: '{{RHOST}}:{{RPORT}}'
