# Exposed AWS credentials
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-aws-credentials
info:
  name: Exposed AWS credentials
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - exposure
  - secrets
  description: 'HTTP probe: Exposed AWS credentials (GET /.aws/credentials).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /.aws/credentials HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - aws_access_key_id
  on_match:
    log: 'Exposed AWS credentials: {{RHOST}} matched'
    capture:
      to: loot/http-aws-credentials.txt
      value: '{{RHOST}}:{{RPORT}}'
