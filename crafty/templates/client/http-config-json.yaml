# Exposed config.json
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-config-json
info:
  name: Exposed config.json
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - exposure
  - secrets
  description: 'HTTP probe: Exposed config.json (GET /config.json).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /config.json HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - password
    - secret
    - apiKey
    - token
  on_match:
    log: 'Exposed config.json: {{RHOST}} matched'
    capture:
      to: loot/http-config-json.txt
      value: '{{RHOST}}:{{RPORT}}'
