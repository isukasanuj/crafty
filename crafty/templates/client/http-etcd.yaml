# etcd
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-etcd
info:
  name: etcd
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - infra
  description: 'HTTP probe: etcd (GET /version).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|2379}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /version HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - etcdserver
    - etcdcluster
  on_match:
    log: 'etcd: {{RHOST}} matched'
    capture:
      to: loot/http-etcd.txt
      value: '{{RHOST}}:{{RPORT}}'
