# HTTP OPTIONS
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-options
info:
  name: HTTP OPTIONS
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  description: 'HTTP probe: HTTP OPTIONS (OPTIONS /).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'OPTIONS / HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - HTTP/
    - Allow
  on_match:
    log: 'HTTP OPTIONS: {{RHOST}} matched'
    capture:
      to: loot/http-options.txt
      value: '{{RHOST}}:{{RPORT}}'
