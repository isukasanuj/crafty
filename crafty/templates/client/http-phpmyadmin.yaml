# phpMyAdmin
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-phpmyadmin
info:
  name: phpMyAdmin
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - exposure
  - db
  description: 'HTTP probe: phpMyAdmin (GET /phpmyadmin/).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /phpmyadmin/ HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - phpMyAdmin
  on_match:
    log: 'phpMyAdmin: {{RHOST}} matched'
    capture:
      to: loot/http-phpmyadmin.txt
      value: '{{RHOST}}:{{RPORT}}'
