# HTTPS exposed .git
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: https-git-exposed
info:
  name: HTTPS exposed .git
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - https
  - web
  - exposure
  description: 'HTTP probe: HTTPS exposed .git (GET /.git/HEAD).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|443}}'
socket:
  timeout: 6s
  tls: true
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /.git/HEAD HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - 'ref:'
  on_match:
    log: 'HTTPS exposed .git: {{RHOST}} matched'
    capture:
      to: loot/https-git-exposed.txt
      value: '{{RHOST}}:{{RPORT}}'
