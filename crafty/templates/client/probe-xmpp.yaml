# XMPP stream open
# Tier: T2  (T2 = constructed from protocol spec; validate against a live service)
# Note: Minimal XMPP stream header; some servers require TLS/SNI first.
# AUTHORIZED TESTING ONLY.
id: probe-xmpp
info:
  name: XMPP stream open
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - xmpp
  description: 'Send-then-read probe: XMPP stream open.'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|5222}}'
socket:
  timeout: 5s
tempo:
  preflight: true
flow:
- send:
    bytes: <?xml version="1.0"?><stream:stream to="{{RHOST}}" xmlns="jabber:client" xmlns:stream="http://etherx.jabber.org/streams"
      version="1.0">
  recv:
    read: 4096
  matchers:
  - type: word
    part: data
    words:
    - <stream
    - jabber
  on_match:
    log: 'XMPP stream open: match'
    capture:
      to: loot/probe-xmpp.txt
      part: data
