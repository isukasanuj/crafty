# FTP
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: banner-ftp
info:
  name: FTP
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - recon
  - banner
  - ftp
  description: Read-first banner grab for FTP.
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|21}}'
socket:
  timeout: 5s
tempo:
  preflight: true
flow:
- recv:
    read: 1024
  matchers:
  - type: word
    part: data
    words:
    - '220'
  on_match:
    log: FTP banner captured
    capture:
      to: loot/banner-ftp.txt
      part: data
