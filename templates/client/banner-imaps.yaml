# IMAPS
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: banner-imaps
info:
  name: IMAPS
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - recon
  - banner
  - imap
  - tls
  - mail
  description: Read-first banner grab for IMAPS.
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|993}}'
socket:
  timeout: 5s
  tls: true
tempo:
  preflight: true
flow:
- recv:
    read: 1024
  matchers:
  - type: word
    part: data
    words:
    - '* OK'
  on_match:
    log: IMAPS banner captured
    capture:
      to: loot/banner-imaps.txt
      part: data
