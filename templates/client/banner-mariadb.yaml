# MariaDB greeting
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: banner-mariadb
info:
  name: MariaDB greeting
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - recon
  - banner
  - mariadb
  - db
  description: Read-first banner grab for MariaDB greeting.
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|3306}}'
socket:
  timeout: 5s
tempo:
  preflight: true
flow:
- recv:
    read: 1024
  matchers:
  - type: len
    part: data
    min: 5
  on_match:
    log: MariaDB greeting banner captured
    capture:
      to: loot/banner-mariadb.txt
      part: data
