# POP3S
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: banner-pop3s
info:
  name: POP3S
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - recon
  - banner
  - pop3
  - tls
  - mail
  description: Read-first banner grab for POP3S.
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|995}}'
socket:
  timeout: 5s
  tls: true
tempo:
  preflight: true
flow:
- recv:
    read: 1024
  matchers:
  - type: word
    part: data
    words:
    - +OK
  on_match:
    log: POP3S banner captured
    capture:
      to: loot/banner-pop3s.txt
      part: data
