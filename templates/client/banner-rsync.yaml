# rsync daemon
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: banner-rsync
info:
  name: rsync daemon
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - recon
  - banner
  - rsync
  description: Read-first banner grab for rsync daemon.
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|873}}'
socket:
  timeout: 5s
tempo:
  preflight: true
flow:
- recv:
    read: 1024
  matchers:
  - type: word
    part: data
    words:
    - '@RSYNCD'
  on_match:
    log: rsync daemon banner captured
    capture:
      to: loot/banner-rsync.txt
      part: data
