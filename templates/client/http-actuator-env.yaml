# Spring actuator env
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-actuator-env
info:
  name: Spring actuator env
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - exposure
  - spring
  description: 'HTTP probe: Spring actuator env (GET /actuator/env).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /actuator/env HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - propertySources
  on_match:
    log: 'Spring actuator env: {{RHOST}} matched'
    capture:
      to: loot/http-actuator-env.txt
      value: '{{RHOST}}:{{RPORT}}'
