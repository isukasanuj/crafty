# Exposed backup.zip
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-backup-zip
info:
  name: Exposed backup.zip
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - exposure
  - backup
  description: 'HTTP probe: Exposed backup.zip (GET /backup.zip).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /backup.zip HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - PK
  on_match:
    log: 'Exposed backup.zip: {{RHOST}} matched'
    capture:
      to: loot/http-backup-zip.txt
      value: '{{RHOST}}:{{RPORT}}'
