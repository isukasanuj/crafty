# CouchDB root
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-couchdb
info:
  name: CouchDB root
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - db
  description: 'HTTP probe: CouchDB root (GET /).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|5984}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET / HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection: close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - couchdb
    - Welcome
  on_match:
    log: 'CouchDB root: {{RHOST}} matched'
    capture:
      to: loot/http-couchdb.txt
      value: '{{RHOST}}:{{RPORT}}'
