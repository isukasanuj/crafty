# Docker remote API
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-docker-api
info:
  name: Docker remote API
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - docker
  - exposure
  description: 'HTTP probe: Docker remote API (GET /version).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|2375}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /version HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - ApiVersion
    - DockerVersion
  on_match:
    log: 'Docker remote API: {{RHOST}} matched'
    capture:
      to: loot/http-docker-api.txt
      value: '{{RHOST}}:{{RPORT}}'
