# Exposed .env
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-env-exposed
info:
  name: Exposed .env
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - exposure
  description: 'HTTP probe: Exposed .env (GET /.env).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /.env HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - APP_
    - DB_
    - SECRET
    - '='
  on_match:
    log: 'Exposed .env: {{RHOST}} matched'
    capture:
      to: loot/http-env-exposed.txt
      value: '{{RHOST}}:{{RPORT}}'
