# Exposed .git/HEAD
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-git-exposed
info:
  name: Exposed .git/HEAD
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - exposure
  description: 'HTTP probe: Exposed .git/HEAD (GET /.git/HEAD).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /.git/HEAD HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - 'ref:'
  on_match:
    log: 'Exposed .git/HEAD: {{RHOST}} matched'
    capture:
      to: loot/http-git-exposed.txt
      value: '{{RHOST}}:{{RPORT}}'
