# Kibana status
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-kibana
info:
  name: Kibana status
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  - elastic
  description: 'HTTP probe: Kibana status (GET /api/status).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|5601}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET /api/status HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection:
      close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - kibana
    - status
  on_match:
    log: 'Kibana status: {{RHOST}} matched'
    capture:
      to: loot/http-kibana.txt
      value: '{{RHOST}}:{{RPORT}}'
