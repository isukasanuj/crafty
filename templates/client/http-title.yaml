# HTTP title/server
# Tier: T1
# AUTHORIZED TESTING ONLY.
id: http-title
info:
  name: HTTP title/server
  author: crafty
  severity: info
  tags:
  - client
  - tcp
  - http
  - web
  description: 'HTTP probe: HTTP title/server (GET /).'
transport: tcp
role: client
target: '{{RHOST}}:{{RPORT|80}}'
socket:
  timeout: 6s
tempo:
  preflight: true
  rate: 20/s
flow:
- send:
    bytes: 'GET / HTTP/1.1\r\nHost: {{RHOST}}\r\nUser-Agent: crafty\r\nAccept: */*\r\nConnection: close\r\n\r\n'
  recv:
    read: 8192
  matchers:
  - type: word
    part: data
    words:
    - 'Server:'
    - <title
  on_match:
    log: 'HTTP title/server: {{RHOST}} matched'
    capture:
      to: loot/http-title.txt
      value: '{{RHOST}}:{{RPORT}}'
