# WS-Discovery probe
# Tier: T2  (T2 = constructed from protocol spec; validate against a live service)
# AUTHORIZED TESTING ONLY.
id: udp-wsd-probe
info:
  name: WS-Discovery probe
  author: crafty
  severity: info
  tags:
  - client
  - udp
  - binary
  - wsd
  - iot
  description: 'UDP binary probe: WS-Discovery probe.'
transport: udp
role: client
target: '{{RHOST}}:{{RPORT|3702}}'
socket:
  timeout: 4s
flow:
- send:
    bytes: <?xml version="1.0"?><e:Envelope xmlns:e="http://www.w3.org/2003/05/soap-envelope" xmlns:d="http://schemas.xmlsoap.org/ws/2005/04/discovery"><e:Header><d:Types>dn:NetworkVideoTransmitter</d:Types></e:Header></e:Envelope>
  recv:
    read: 4096
  matchers:
  - type: len
    part: data
    min: 1
  on_match:
    log: 'WS-Discovery probe: response from {{RHOST}}'
    capture:
      to: loot/udp-wsd-probe.txt
      part: data
